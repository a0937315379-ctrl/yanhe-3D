function init(){scene=new THREE.Scene();scene.background=new THREE.Color('#9be4e9');scene.fog=new THREE.Fog('#9be4e9',25,75);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,110);scene.add(new THREE.HemisphereLight(0xffffff,0x7994a0,2.3));let sun=new THREE.DirectionalLight(0xfff0d5,2.5);sun.position.set(-5,12,9);scene.add(sun);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('click',e=>{if(room==='map'){let pt=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);let ray=new THREE.Raycaster();ray.setFromCamera(pt,camera);let hits=ray.intersectObjects(scene.children,true);let hit=hits.find(h=>h.object.userData.entry);if(hit)enterRoom(hit.object.userData.entry)}});animate()}

function map(){room='map';clear();$('zone').textContent='🏝️ 延和學習群島 · 地圖';$('hint').textContent='點選中央紫色「社會技巧館」進入第一人稱場景';$('movePad').classList.add('hidden');$('lookPad').classList.add('hidden');let sea=cylinder(0,-.75,0,35,.5,'#48cfd4',48);let island=cylinder(0,-.24,0,9,.7,'#fffaf0',12);cylinder(0,-.72,0,9.25,.28,'#d8bc8c',12);for(let i=0;i<14;i++){let a=i*Math.PI*2/14;tree(Math.cos(a)*7,Math.sin(a)*7)}let b=box(0,1,0,3.6,2.4,3.6,'#9c65d9');let roof=new THREE.Mesh(new THREE.ConeGeometry(3,2.2,6),new THREE.MeshLambertMaterial({color:'#784bbb',flatShading:true}));roof.position.set(0,3.25,0);scene.add(roof);b.userData.entry='social';roof.userData.entry='social';cylinder(0,.18,2.05,.85,.27,'#a8d3b7');label('🤝 社會技巧館',0,0);for(let [x,z,cl,txt] of [[-5,-3,'#83bde0','🎼 音樂魔法館'],[5,-3,'#f6b79e','🌿 生活應用館'],[5,4,'#e9bc66','🧩 跨域探究館']]){box(x,.8,z,1.8,1.6,1.8,cl);let a=new THREE.Mesh(new THREE.ConeGeometry(1.5,1.3,4),new THREE.MeshLambertMaterial({color:'#ffffff'}));a.position.set(x,2.2,z);a.rotation.y=Math.PI/4;scene.add(a);label(txt,x,z)}camera.position.set(10,15,18);camera.lookAt(0,0,0)}
function enterRoom(){room='inside';clear();$('zone').textContent='🤝 社會技巧館 · 第一人稱探索';$('movePad').classList.remove('hidden');$('lookPad').classList.remove('hidden');$('hint').textContent='走近發光人物，按「對話」；或用空白鍵';box(0,-.25,0,24,.5,24,'#a77e62');box(0,4,-12,24,8,.5,'#c5ada0');box(-12,4,0,.5,8,24,'#d9c5bb');box(12,4,0,.5,8,24,'#d9c5bb');box(0,4,12,24,8,.5,'#ded4c9');box(4,1,-8,5,1,1.6,'#ad896d');for(let i=0;i<4;i++)box(4-i*2,.65,-8,1.0,.8,1,'#f6d8bb');box(-9,2,-11.6,2.8,3,.2,'#b8ecf5');box(8,2,-11.6,2.8,3,.2,'#b8ecf5');box(-10,2,1,2,3,1,'#87624f');for(let z=-5;z<8;z+=2.1)for(let x of [-4,4]){box(x,.65,z,2,.15,1.2,'#a47154');box(x,0.3,z-.4,.15,.6,.15,'#755741');box(x,.3,z+.4,.15,.6,.15,'#755741')};for(let i=0;i<3;i++){let z=-7+i*6;let x=i%2===0?-7:7;let s=cylinder(x,1.1,z,.5,2.0,['#f3bda9','#abc9f4','#d9a4d9'][i],9);sphere(x,2.4,z,.54,'#ffdec2');s.userData.task=i;let mark=sphere(x,3.45,z,.26,completed.has(i)?'#a8b4b4':'#ffdc4a');mark.userData.task=i;label(['同學甲｜排隊','同學乙｜分組','同學丙｜誤會'][i],x,z)}px=0;pz=8;yaw=0;$('score').textContent='社會技巧館｜'+completed.size+' / 3 顆星'}
function interact(){if(room!=='inside'||lock)return;let pos=[[-7,-7],[7,-1],[-7,5]],nearest=pos.map(([x,z],i)=>({i,d:Math.hypot(px-x,pz-z)})).sort((a,b)=>a.d-b.d)[0];if(nearest.d>4.8){$('hint').textContent='請先走近人物，再按「對話」';return}currentTask=nearest.i;openTask()}
function openTask(){lock=true;let t=tasks[currentTask];$('dialog').classList.remove('hidden');$('step').textContent='情境 '+(currentTask+1)+'/3 · '+t.name;$('question').textContent=t.q;$('story').textContent=t.story;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').innerHTML='';t.options.forEach((o,i)=>{let b=document.createElement('button');b.className='btn alt';b.textContent=(i+1)+'. '+o;b.onclick=()=>{if(i===t.good){$('feedback').textContent='⭐ 做得好！'+t.why;completed.add(currentTask);$('score').textContent='社會技巧館｜'+completed.size+' / 3 顆星';$('choices').querySelectorAll('button').forEach(el=>el.disabled=true);$('next').classList.remove('hidden')}else{$('feedback').textContent='可以再想一想：怎樣說，既能表達自己，又不傷害彼此？'}};$('choices').appendChild(b)})}

er.render(scene,camera)}init();map();
